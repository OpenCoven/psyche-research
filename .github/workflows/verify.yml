name: Verify archive guarantees
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guarantees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOCAL_DEVELOPMENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: mkdir -m 700 var
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --fail-level WARNING
      - run: python manage.py test --verbosity 2
      - run: python manage.py collectstatic --noinput
      - name: Production settings check with an ephemeral test-only key
        run: |
          python - <<'PY'
          import os, secrets, subprocess, sys
          env={**os.environ,'LOCAL_DEVELOPMENT':'0','DJANGO_SECRET_KEY':secrets.token_urlsafe(64),'DJANGO_ALLOWED_HOSTS':'research.example.invalid'}
          subprocess.run([sys.executable,'manage.py','check','--deploy','--fail-level','WARNING'],env=env,check=True)
          PY
  postgres-guarantees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coven_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: test_coven_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOCAL_DEVELOPMENT: '1'
      DATABASE_URL: postgres://coven_test:test-only-password@127.0.0.1:5432/test_coven_research?sslmode=disable
      POSTGRES_GUARANTEE_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --fail-level WARNING
      - run: python manage.py test archive.tests.test_postgres --verbosity 2
      - run: python manage.py verify_archive
